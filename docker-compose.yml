services:
  # ==========================================
  # Relational Database: PostgreSQL 16
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: energy-monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: energy_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d energy_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Web Database Browser: Adminer (Port 8080)
  # ==========================================
  adminer:
    image: adminer:latest
    container_name: energy-monitor-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # IoT Message Broker: Eclipse Mosquitto
  # ==========================================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: energy-monitor-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  # ==========================================
  # Backend: Energy Monitor REST API & Ingestion
  # ==========================================
  energy-monitor-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: energy-monitor-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/energy_monitor
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
  mosquitto_data:
