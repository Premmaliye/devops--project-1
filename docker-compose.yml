services:
  postgres:
    image: postgres:16-alpine
    container_name: energy-monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: energy_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d energy_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  energy-monitor-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: energy-monitor-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/energy_monitor
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
