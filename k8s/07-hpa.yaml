# ========================================================
# Horizontal Pod Autoscaler (HPA) for IoT Traffic Spikes
# ========================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: energy-monitor-api-hpa
  namespace: energy-monitoring
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: energy-monitor-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
