# ========================================================
# Energy Monitor API Deployment (High Availability & Probes)
# ========================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: energy-monitor-api
  namespace: energy-monitoring
  labels:
    app.kubernetes.io/name: energy-monitor-api
    app.kubernetes.io/part-of: energy-monitoring
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: energy-monitor-api
  template:
    metadata:
      labels:
        app: energy-monitor-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/health"
    spec:
      containers:
        - name: api
          image: energy-monitor-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: energy-monitor-config
            - secretRef:
                name: energy-monitor-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Kubernetes Health Probes
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
