apiVersion: v1
kind: Secret
metadata:
  name: energy-monitor-secrets
  namespace: energy-monitoring
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgrespassword"
  POSTGRES_DB: "energy_monitor"
  DATABASE_URL: "postgres://postgres:postgrespassword@energy-monitor-db:5432/energy_monitor"
